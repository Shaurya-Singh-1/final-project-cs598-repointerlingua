[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repointerlingua"
version = "0.1.0"
description = "RYS-inspired explicit BugState software-agent research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pipenv>=2024.4.0"]

[project.optional-dependencies]
openai = ["openai>=1.52.0"]
gpu = [
  "transformers>=4.46.0",
  "accelerate>=1.1.0",
  "datasets>=3.0.0",
  "peft>=0.13.0"
]
plots = ["matplotlib>=3.9.0"]

[project.scripts]
repointerlingua = "repointerlingua.cli:main"

[tool.setuptools.packages.find]
include = ["repointerlingua*"]
